name: sync simdutf

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Mondays at 03:00 UTC

jobs:
  sync:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Sync simdutf
        run: bash scripts/sync-simdutf.sh
